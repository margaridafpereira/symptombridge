name: Web app

# Builds the Flutter web app and publishes it to GitHub Pages:
# https://margaridafpereira.github.io/symptombridge/
# The Worker URL comes from the repository variable SYMPTOMBRIDGE_API (Settings → Secrets and
# variables → Actions → Variables). Without it the app runs on the rules alone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --base-href /symptombridge/ --dart-define=SYMPTOMBRIDGE_API=${{ vars.SYMPTOMBRIDGE_API }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
